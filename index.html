<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harf by HIA · Coming soon</title>
<meta name="description" content="Arabic letters and bedtime stories for little ones, made by a family in India. Coming soon.">
<meta property="og:title" content="Harf by HIA · Coming soon">
<meta property="og:description" content="Arabic letters and bedtime stories for little ones, made by a family in India.">
<meta property="og:url" content="https://harfbyhia.in">
<meta name="theme-color" content="#FFF8F1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  try { var t = localStorage.getItem("harf-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Fredoka:wght@400;500;600&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --ink:#4A4560; --ink-soft:#5A5570; --accent:#6A5AA8; --line:#C9BDEB; --panel:#F3EEFB; --hairline:#E3DCF2;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Fredoka', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --arabic:'Baloo Bhaijaan 2', 'Noto Naskh Arabic', 'Geeza Pro', Arial, sans-serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#221F2E; --surface:#2E2A3E; --ink:#F3EEFF; --ink-soft:#CFC8E4; --accent:#C3B5F5; --line:#6C5FA0; --panel:#2B2740; --hairline:#4A4463; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#221F2E; --surface:#2E2A3E; --ink:#F3EEFF; --ink-soft:#CFC8E4; --accent:#C3B5F5; --line:#6C5FA0; --panel:#2B2740; --hairline:#4A4463; color-scheme: dark; }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:18px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden; transition:background-color .3s ease, color .3s ease; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
svg{ max-width:100%; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; border-radius:12px; }
.page{ min-height:100%; display:flex; flex-direction:column; }
header{ display:flex; justify-content:space-between; align-items:center; padding:18px 24px; max-width:1100px; width:100%; margin:0 auto; }
.wordmark{ font-family:var(--serif); font-weight:600; font-size:22px; }
.wordmark i{ font-weight:400; font-size:16px; color:var(--accent); }
.theme-btn{ width:44px; height:44px; border-radius:50%; border:none; background:var(--surface); color:var(--ink); display:grid; place-items:center; cursor:pointer; box-shadow:inset 0 0 0 2px var(--hairline); }
main{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px 24px 0; position:relative; }
.tiles{ display:flex; justify-content:center; gap:clamp(12px, 2.4vw, 22px); margin-top:clamp(8px, 4vh, 40px); }
.tile{ width:clamp(88px, 14vw, 140px); aspect-ratio:15/17; border-radius:clamp(20px,3vw,28px); display:grid; place-items:center; font-family:var(--arabic); font-weight:800; font-size:clamp(58px, 9.5vw, 96px); color:#4A4560; transform:rotate(var(--r)); animation:drop 1s cubic-bezier(.3,1.5,.5,1) both; }
.t1{ background:#F7C6CE; box-shadow:0 12px 0 #E9A9B5; --r:-7deg; animation-delay:.1s; }
.t2{ background:#BFE6D6; box-shadow:0 12px 0 #9CD2BC; --r:5deg; animation-delay:.35s; }
.t3{ background:#C6DDF3; box-shadow:0 12px 0 #A2C2E5; --r:-3deg; animation-delay:.6s; }
@keyframes drop{ 0%{opacity:0; transform:translateY(-150px) rotate(0)} 100%{opacity:1; transform:translateY(0) rotate(var(--r))} }
.line{ position:relative; width:min(560px, 90%); height:46px; margin:20px auto 0; }
.line .dots{ position:absolute; inset:0; clip-path:inset(0 0 0 100%); animation:reveal 1.6s ease-out 1.1s forwards; }
@keyframes reveal{ to{ clip-path:inset(0 0 0 0); } }
.line .pencil{ position:absolute; top:2px; right:-16px; animation:pencil 1.6s ease-out 1.1s both; }
@keyframes pencil{ from{ right:-16px; } to{ right:calc(100% - 20px); } }
.soon{ margin:22px 0 0; display:flex; gap:12px; align-items:baseline; justify-content:center; color:var(--accent); font-weight:500; font-size:18px; }
.soon .ar{ font-family:var(--arabic); font-weight:700; font-size:26px; }
h1{ margin:10px auto 0; font-family:var(--serif); font-weight:600; font-size:clamp(40px, 6.4vw, 76px); line-height:1.04; letter-spacing:-.015em; max-width:860px; }
p.sub{ margin:16px auto 0; max-width:560px; color:var(--ink-soft); font-size:20px; }
.friends{ display:flex; align-items:flex-end; justify-content:center; gap:clamp(8px, 4vw, 48px); margin-top:auto; padding-top:32px; }
.bob{ animation:bob 3s ease-in-out infinite; transform-origin:50% 100%; }
.late{ animation-delay:1.2s; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(0)} 30%{ transform:translateY(-9px) rotate(-2deg)} 60%{ transform:translateY(0) rotate(2deg)} }
.floor{ height:28px; background:var(--panel); }
.spark{ position:absolute; animation:twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.1);} }
footer{ text-align:center; padding:18px 24px 26px; background:var(--panel); font-size:14px; letter-spacing:.2em; color:var(--ink-soft); }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
  .line .dots{ clip-path:none; } .line .pencil{ right:calc(100% - 20px); }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="wordmark">Harf <i>by HIA</i></span>
    <button class="theme-btn" id="themeBtn" type="button" aria-pressed="false" aria-label="Dark mode">
      <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </header>
  <main>
    <svg class="spark" style="left:9%;top:40px" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="#F7B32B"/></svg>
    <svg class="spark" style="right:11%;top:24px;animation-delay:.8s" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="#9B7FE6"/></svg>
    <svg class="spark" style="right:17%;top:250px;animation-delay:1.6s" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="#2EC4A6"/></svg>
    <svg class="spark" style="left:15%;top:270px;animation-delay:1.1s" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" fill="#F2665E"/></svg>

    <div class="tiles" dir="rtl" aria-hidden="true"><div class="tile t1">ح</div><div class="tile t2">ر</div><div class="tile t3">ف</div></div>
    <div class="line" aria-hidden="true">
      <svg class="dots" viewBox="0 0 600 48" preserveAspectRatio="none" width="100%" height="46"><path d="M590 18 Q450 40 300 22 Q150 6 14 26" stroke="#C9BDEB" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="2 12" vector-effect="non-scaling-stroke"/></svg>
      <svg class="pencil" width="54" height="30" viewBox="0 0 54 30"><rect x="10" y="9" width="34" height="12" rx="3" fill="#F6D98A"/><rect x="40" y="9" width="8" height="12" rx="2" fill="#F5B8C3"/><path d="M10 9 L0 15 L10 21 Z" fill="#E9C9A4"/><path d="M3 13.5 L0 15 L3 16.5 Z" fill="#4A4560"/></svg>
    </div>

    <p class="soon"><span class="ar" dir="rtl" lang="ar">قريباً</span><span>Coming soon</span></p>
    <h1>Arabic, one letter at a time.</h1>
    <p class="sub">Letters to learn by day and stories to love at bedtime, made by our family for little ones. Our shelf opens soon.</p>

    <div class="friends">
      <div class="bob" data-art="husena"></div>
      <div class="bob late" data-art="hasan"></div>
    </div>
  </main>
  <div class="floor"></div>
  <footer><a href="mailto:h@harfbyhia.in" style="color:inherit;letter-spacing:.04em;font-size:16px;text-decoration:underline;text-underline-offset:4px">h@harfbyhia.in</a><div style="margin-top:8px">HARF · BY HIA</div></footer>
</div>

  var ARTS = { husena: sized(HUSENA, small ? 130 : 180, small ? 173 : 240), hasan: sized(HASAN, small ? 130 : 180, small ? 173 : 240) };
